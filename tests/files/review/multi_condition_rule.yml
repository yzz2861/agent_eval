title: Office Spawns Downloading PowerShell
name: office_powershell_download
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
    selection_command:
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'IEX'
    filter_signed:
        Image|endswith: '\powershell.exe'
    unused_context:
        User: 'svc-backup'
    condition: selection_parent and selection_command and not filter_signed
fields:
    - ParentImage
    - CommandLine
    - Image
