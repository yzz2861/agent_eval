[pytest]
# This evaluation venv ships a broken pytest_httpbin plugin (missing itsdangerous)
# and a relaxed plugin that stats parent dirs the sandbox forbids. Disable both
# so the tri-state suite can collect; run it with an explicit confcutdir, e.g.
#   python -m pytest tests/tri_state -q --confcutdir=tests/tri_state
addopts = -p no:httpbin -p no:relaxed -p no:cacheprovider
