name: release

# Releases are triggered manually by pushing a git tag:
#   - v1.4.0-rc1  -> GitHub pre-release (the candidate used for the Apache vote)
#   - v1.4.0      -> GitHub release + publish to PyPI
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.4.0-rc1 -> 1.4.0-rc1, v1.4.0 -> 1.4.0
          VERSION="${TAG#v}"
          # The release candidate is voted on as the final version, so strip "-rcN".
          BASE_VERSION="${VERSION%%-rc*}"
          if [ "$VERSION" != "$BASE_VERSION" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # The source release must describe its own version, so pyproject.toml
          # has to be bumped and committed before the tag is pushed.
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$PROJECT_VERSION" != "$BASE_VERSION" ]; then
            echo "::error::tag $TAG expects version $BASE_VERSION in pyproject.toml, found $PROJECT_VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build Apache source release
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          NAME="apache-casbin-pycasbin-${BASE_VERSION}-incubating-src"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha512sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha512"

      - name: Build Python distributions
        if: steps.version.outputs.prerelease == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $FLAGS \
            apache-casbin-pycasbin-*-incubating-src.tar.gz \
            apache-casbin-pycasbin-*-incubating-src.tar.gz.sha512

      - name: Publish to PyPI
        if: steps.version.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN_CASBIN }}
